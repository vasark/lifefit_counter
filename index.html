<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172337">
  <meta name="description" content="LifeFitの来店回数を記録する個人用カウンター">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LF Counter">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#172337">
  <title>LifeFit Counter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">LF</div>
      <div>
        <p class="eyebrow">MY GYM LOG</p>
        <h1>LifeFit Counter</h1>
      </div>
    </header>

    <section class="hero" aria-labelledby="month-heading">
      <p class="section-label" id="month-heading">今月の来店回数</p>
      <div class="count-line">
        <span class="count" id="month-count">0</span>
        <span class="count-unit">回</span>
      </div>
      <p class="period" id="month-label">----年--月</p>
      <button class="primary-button" id="record-button" type="button">
        <span aria-hidden="true">＋</span> 今日の来店を記録
      </button>
      <p class="today-status" id="today-status" aria-live="polite">今日の記録はまだありません</p>
    </section>

    <section class="year-card" aria-labelledby="year-heading">
      <div>
        <p class="section-label" id="year-heading">今年の来店回数</p>
        <p class="year-number"><span id="year-count">0</span><span>回</span></p>
      </div>
      <div class="year-icon" aria-hidden="true">↗</div>
      <p class="year-label" id="year-label">----年</p>
    </section>

    <section class="history-section" aria-labelledby="history-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR ACTIVITY</p>
          <h2 id="history-heading">来店履歴</h2>
        </div>
        <span class="history-total" id="history-total">0件</span>
      </div>
      <p class="empty-state" id="empty-state">まだ記録がありません。ジムに行ったら、上のボタンから記録しよう！</p>
      <ul class="history-list" id="history-list"></ul>
      <button class="text-button" id="toggle-history" type="button" hidden>すべての履歴を見る</button>
    </section>

    <footer class="footer">
      <p>記録はこのブラウザ内に保存されます。</p>
      <button class="reset-button" id="reset-button" type="button">記録をすべて削除</button>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
